<style>
.lab{font-family:'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace;font-size:14px;fill:#FFE7D9}
.t{font-family:Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', sans-serif;font-size:58px;font-weight:800;fill:#fff;letter-spacing:-1.5px}
.s{font-family:Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', sans-serif;font-size:22px;font-weight:700;fill:#fff}
